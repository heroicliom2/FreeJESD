name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (iverilog, verilator)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: Toolchain versions
        run: |
          iverilog -V
          vvp -V
          verilator --version

      - name: make test
        run: make test

      # This codebase has never been run through verilator before (not
      # installed on the primary dev machine, see docs/TOOLCHAIN.md) — until
      # its findings have been triaged, don't let untested lint noise turn CI
      # red for a suite that's actually passing. Output still shows in the
      # log for visibility.
      - name: make lint
        run: make lint
        continue-on-error: true

      - name: Upload testbench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbench-logs
          path: build/*.log
